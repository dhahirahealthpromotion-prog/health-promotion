    <script>
      // Global Emergency Recovery and Cache Clearance Engine
      window.__APP_LOADED__ = false;
      
      // Define global recovery function
      window.clearCacheAndReload = function() {
        console.log("Starting full cache clearance and reload...");
        try {
          localStorage.clear();
          sessionStorage.clear();
        } catch (e) {
          console.error("Local storage clear failed:", e);
        }

        if ('caches' in window) {
          caches.keys().then(function(names) {
            return Promise.all(
              names.map(function(name) {
                return caches.delete(name);
              })
            );
          }).then(unregisterSWAndReload).catch(unregisterSWAndReload);
        } else {
          unregisterSWAndReload();
        }
      };

      function unregisterSWAndReload() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            return Promise.all(
              registrations.map(function(reg) {
                return reg.unregister();
              })
            );
          }).then(function() {
            window.location.reload(true);
          }).catch(function() {
            window.location.reload(true);
          });
        } else {
          window.location.reload(true);
        }
      }

      // Capture errors globally to diagnose and display recovery option instead of blank screen
      window.addEventListener('error', function(event) {
        // Ignore resource loading errors (e.g. images, stylesheets)
        if (event.target && (event.target.tagName === 'IMG' || event.target.tagName === 'LINK' || event.target.tagName === 'SCRIPT')) {
          return;
        }
        // Ignore ResizeObserver errors which are harmless
        if (event.message && event.message.includes('ResizeObserver')) {
          return;
        }
        console.error("App captured global error:", event.error || event.message);
        if (!window.__APP_LOADED__) {
          showEmergencyUI(event.message || "Failed to load application assets");
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        console.error("App captured unhandled rejection:", event.reason);
        if (!window.__APP_LOADED__) {
          var msg = event.reason ? (event.reason.message || String(event.reason)) : "Promise rejection occurred";
          showEmergencyUI(msg);
        }
      });

      function showEmergencyUI(errorText) {
        var loaderMessage = document.getElementById('preloader-status-text');
        var loaderAction = document.getElementById('preloader-trouble');
        if (loaderMessage) {
          loaderMessage.innerHTML = "حدث خطأ أثناء تحميل الملفات اللازمة لتشغيل التطبيق.";
          loaderMessage.style.color = "#991B1B";
        }
        if (loaderAction) {
          loaderAction.innerHTML = `
            <div style="background-color: #FEF2F2; border-right: 4px solid #EF4444; padding: 0.85rem; border-radius: 0.5rem; margin-top: 1rem; margin-bottom: 1.5rem; text-align: right; font-size: 0.85rem; color: #991B1B; font-family: monospace; word-break: break-all; direction: ltr;">
              ⚠️ Error: ${errorText}
            </div>
            <button onclick="window.clearCacheAndReload()" style="width: 100%; cursor: pointer; background: linear-gradient(135deg, #1D4ED8 0%, #1E3A8A 100%); color: white; border: none; padding: 0.95rem 1.5rem; font-size: 1.1rem; font-weight: bold; border-radius: 0.75rem; box-shadow: 0 4px 12px rgba(30, 58, 138, 0.35); outline: none; transition: transform 0.2s; font-family: 'Tajawal', sans-serif;">
              تحديث التطبيق ومسح الذاكرة المؤقتة 🔄
            </button>
            <p style="font-size: 0.8rem; color: #6B7280; margin-top: 0.85rem;">
              سيتم تفريغ الملفات المؤقتة التالفة وتنزيل أحدث إصدار آمن متوافق.
            </p>
          `;
          loaderAction.style.display = "block";
        }
      }
    </script>

    <script>
      window.__BUILD_ID__ = "build_20260602_v25";
      // Clear legacy browser caches to ensure latest updates are loaded
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
             caches.delete(name);
          }
        });
      }

      // Register the pass-through service worker required for PWA installation
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(reg) {
              console.log('Service Worker Registered for PWA installation', reg);
              reg.update();
            })
            .catch(function(err) {
              console.warn('Service Worker failed:', err.message);
            });
        });
      }
      
      // Force reload once if from cache (optional, but helps with aggressive browsers)
      window.addEventListener('pageshow', function (event) {
          if (event.persisted) {
              window.location.reload();
          }
      });
    </script>

<body class="bg-slate-100 text-gray-900 transition-colors duration-300">
    <div id="root">
        <!-- Arabic Pre-loader: shown during early load, automatically discarded by React mount -->
        <div id="app-preloader" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: #F8FAFC; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; font-family: 'Tajawal', sans-serif; direction: rtl;">
            <div style="display: flex; flex-direction: column; align-items: center; max-width: 380px; width: 90%; padding: 2rem; text-align: center; box-sizing: border-box;">
                
                <!-- Beautiful pulsating target ring with center logo background layout -->
                <div style="position: relative; width: 90px; height: 90px; margin-bottom: 2rem; display: flex; align-items: center; justify-content: center;">
                    <div style="position: absolute; width: 100%; height: 100%; border: 4px solid #1E3A8A; border-top-color: #3B82F6; border-radius: 50%; animation: preloader-spin 1s linear infinite;"></div>
                    <div style="position: absolute; width: calc(100% - 16px); height: calc(100% - 16px); background-color: #1E3A8A; border-radius: 50%; opacity: 0.12; animation: preloader-pulse 1.8s ease-in-out infinite;"></div>
                    <!-- Small medical visual cue -->
                    <span style="font-size: 2rem; color: #1E3A8A; z-index: 10; animation: preloader-bounce 1.5s ease-in-out infinite;">✨</span>
                </div>
                
                <h2 style="font-size: 1.4rem; font-weight: 800; color: #1E3A8A; margin: 0 0 0.5rem 0;">برنامج الإجادة المؤسسية</h2>
                <p id="preloader-status-text" style="font-size: 1rem; color: #1E40AF; opacity: 0.9; margin: 0 0 1.5rem 0; font-weight: 500; min-height: 1.5rem; transition: color 0.3s;">جاري تهيئة وتحديث ملفات التطبيق...</p>
                
                <!-- Action section to clear cache or show diagnostic if loading takes too long -->
                <div id="preloader-trouble" style="display: none; animation: preloader-fade 0.5s ease forwards; width: 100%;">
                    <p style="margin: 0 0 0.75rem 0; font-size: 0.85rem; color: #4B5563; font-weight: 500;">هل استغرق التحميل وقتاً طويلاً؟</p>
                    <button onclick="window.clearCacheAndReload()" style="width: 100%; cursor: pointer; background-color: #D4AF37; color: #111827; border: none; padding: 0.75rem 1.25rem; border-radius: 0.75rem; font-weight: bold; font-size: 0.95rem; box-shadow: 0 4px 10px rgba(212, 175, 55, 0.2); transition: all 0.2s; font-family: 'Tajawal', sans-serif;">🔄 إصلاح وتحديث التطبيق فوراً</button>
                </div>
            </div>
            
            <style>
                @keyframes preloader-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
                @keyframes preloader-pulse { 0%, 100% { transform: scale(0.9); opacity: 0.15; } 50% { transform: scale(1.1); opacity: 0.3; } }
                @keyframes preloader-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
                @keyframes preloader-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
            </style>
            <script>
                // Show trouble-shooting button if loading takes more than 7 seconds
                setTimeout(function() {
                    var troubleshooter = document.getElementById('preloader-trouble');
                    if (troubleshooter) {
                        troubleshooter.style.display = 'block';
                    }
                    var statusText = document.getElementById('preloader-status-text');
                    if (statusText) {
                        statusText.innerHTML = "تهيئة الاتصال ببيانات الإجادة المؤسسية...";
                    }
                }, 7000);
            </script>
        </div>
    </div>
